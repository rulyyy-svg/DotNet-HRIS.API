
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to HRIS</title>
</head>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="padding:24px 0;">

        <tr>
            <td align="center">

                <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                       style="background:#ffffff;border-radius:8px;padding:32px;">

                    <tr>
                        <td>

                            <h1 style="margin:0 0 16px;font-size:22px;color:#1f2937;">
                                Welcome, {FullName}!
                            </h1>

                            <p style="margin:0 0 12px;color:#374151;line-height:1.5;">
                                Your employee record has been created.
                                Your employee number is
                                <strong>{EmployeeNumber}</strong>.
                            </p>

                            <p style="margin:0 0 24px;color:#374151;line-height:1.5;">
                                Activate your HRIS account to sign in for the first time.
                            </p>

                            <p style="margin:0 0 24px;">
                                <a href="{ActivationUrl}"
                                   style="background:#2563eb;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block;">
                                    Activate account
                                </a>
                            </p>

                            <p style="margin:0;color:#6b7280;font-size:12px;">
                                If you did not expect this email, you can ignore it.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </table>

</body>
</html>
